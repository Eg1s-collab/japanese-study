<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなの日本語ドリル — ฝึกไวยากรณ์ JLPT (มินนะ)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">み</span>
      <div>
        <h1>みんなの日本語ドリル</h1>
        <p class="tag">สำหรับฝึกภาษาญี่ปุ่น</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="syncStatus" class="sync-status"></span>
      <button id="signInBtn" class="btn google-btn">
        <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.27h2.92c1.71-1.58 2.68-3.91 2.68-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A8.99 8.99 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.7a5.41 5.41 0 0 1 0-3.4V4.97H.96a9 9 0 0 0 0 8.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A8.99 8.99 0 0 0 .96 4.97l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        <span>เข้าสู่ระบบ</span>
      </button>
      <span id="userInfo" class="user-info" style="display:none;"></span>
      <label for="levelSelect" class="lvl-label">ระดับ</label>
      <select id="levelSelect" class="level-select"></select>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="units">📖 บทเรียน</button>
    <button class="tab" data-tab="quiz">📝 แบบฝึกหัด</button>
    <button class="tab" data-tab="conjugation">🔁 ผันคำ</button>
    <button class="tab" data-tab="flashcards">📇 บัตรคำ</button>
    <button class="tab" data-tab="bookmarks">⭐ ทวนซ้ำ</button>
  </nav>

  <main id="view"></main>

  <footer class="foot">
    <span>โครงสร้างพร้อมขยายระดับ N4 / N3 — เพิ่มไฟล์ <code>js/data/&lt;level&gt;/</code> แล้ว register ใน <code>js/data/index.js</code></span>
  </footer>

  <script src="js/data/n5/units.js"></script>
  <script src="js/data/n5/conjugation.js"></script>
  <script src="js/data/index.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/conj_storage.js"></script>
  <script src="js/flashcards_storage.js"></script>
  <script src="js/lesson_progress.js"></script>
  <script src="js/views/units.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/conjugation.js"></script>
  <script src="js/views/flashcards.js"></script>
  <script src="js/views/bookmarks.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/cloud_sync.js"></script>
</body>
</html>
