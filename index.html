<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0c14" />
  <title>日本語ドリル — ฝึกภาษาญี่ปุ่น</title>
  <link rel="stylesheet" href="css/style.css?v=20260530a" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-orb ambient-orb-1"></span>
    <span class="ambient-orb ambient-orb-2"></span>
    <span class="ambient-orb ambient-orb-3"></span>
    <span class="ambient-kanji ambient-kanji-1">学</span>
    <span class="ambient-kanji ambient-kanji-2">道</span>
    <span class="ambient-kanji ambient-kanji-3">心</span>
  </div>

  <header class="topbar glass">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <span class="logo-char">日</span>
      </span>
      <div class="brand-text">
        <h1>
          <span class="brand-jp">日本語</span>
          <span class="brand-romaji">Study</span>
        </h1>
      </div>
    </div>
    <div class="topbar-right">
      <span id="syncStatus" class="sync-status"></span>
      <button id="signInBtn" class="btn google-btn">
        <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.27h2.92c1.71-1.58 2.68-3.91 2.68-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A8.99 8.99 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.7a5.41 5.41 0 0 1 0-3.4V4.97H.96a9 9 0 0 0 0 8.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A8.99 8.99 0 0 0 .96 4.97l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        <span>เข้าสู่ระบบ</span>
      </button>
      <span id="userInfo" class="user-info" style="display:none;"></span>
      <div class="theme-wrap">
        <button id="themeBtn" class="theme-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="เลือกธีมสี" title="เลือกธีมสี">
          <span class="theme-btn-dot"></span>
        </button>
        <div id="themePopover" class="theme-popover" role="dialog" aria-label="เลือกธีมสี" hidden>
          <div class="theme-popover-title">ธีมสี</div>
          <div class="theme-grid">
            <button class="theme-swatch" data-theme="sakura" title="桜 ซากุระ" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="indigo" title="藍 อินดิโก้" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="matcha" title="抹茶 มัทฉะ" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="fuji" title="藤 ฟูจิ" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="shu" title="朱 ชู (vermillion)" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="kurenai" title="紅 คุเรไน (แดง)" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="kogane" title="黄金 ทอง" type="button"><span></span></button>
            <button class="theme-swatch" data-theme="sumi" title="墨 สุมิ (mono)" type="button"><span></span></button>
          </div>
        </div>
      </div>
      <div class="level-wrap">
        <label for="levelSelect" class="lvl-label">ระดับ</label>
        <select id="levelSelect" class="level-select"></select>
      </div>
    </div>
  </header>

  <nav class="tabs glass" role="tablist" aria-label="เมนูหลัก">
    <button class="tab active" data-tab="units" role="tab" aria-selected="true" tabindex="0">
      <span class="tab-jp">本</span>
      <span class="tab-label">บทเรียน</span>
    </button>
    <button class="tab" data-tab="quiz" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">問</span>
      <span class="tab-label">แบบฝึกหัด</span>
    </button>
    <button class="tab" data-tab="particles" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">助</span>
      <span class="tab-label">คำช่วย</span>
    </button>
    <button class="tab" data-tab="conjugation" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">活</span>
      <span class="tab-label">ผันคำ</span>
    </button>
    <button class="tab" data-tab="flashcards" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">札</span>
      <span class="tab-label">บัตรคำ</span>
    </button>
    <button class="tab" data-tab="dictation" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">聞</span>
      <span class="tab-label">ฟังเขียน</span>
    </button>
    <button class="tab" data-tab="arrange" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">並</span>
      <span class="tab-label">เรียงประโยค</span>
    </button>
    <button class="tab" data-tab="bookmarks" role="tab" aria-selected="false" tabindex="-1">
      <span class="tab-jp">星</span>
      <span class="tab-label">ทวนซ้ำ</span>
    </button>
  </nav>

  <main id="view"></main>

  <footer class="foot">
    <span>เนื้อหา N5 (Minna I 1–25) · N4 (Minna II 26–50) · N3 (JLPT N3 文法)</span>
  </footer>

  <script src="js/theme.js?v=20260516l"></script>
  <script src="js/data/n5/units.js?v=20260516j"></script>
  <script src="js/data/n5/conjugation.js?v=20260516j"></script>
  <script src="js/data/n4/units.js?v=20260516j"></script>
  <script src="js/data/n4/conjugation.js?v=20260516j"></script>
  <script src="js/data/n3/units.js?v=20260516j"></script>
  <script src="js/data/n3/conjugation.js?v=20260516j"></script>
  <script src="js/data/n3/videos.js?v=20260516j"></script>
  <script src="js/data/particles.js?v=20260522g"></script>
  <script src="js/data/sentences.js?v=20260523c"></script>
  <script src="js/data/index.js?v=20260516j"></script>
  <script src="js/storage.js?v=20260516j"></script>
  <script src="js/conj_storage.js?v=20260516j"></script>
  <script src="js/flashcards_streak.js?v=20260522e"></script>
  <script src="js/flashcards_storage.js?v=20260522f"></script>
  <script src="js/flashcards_daily.js?v=20260522f"></script>
  <script src="js/lesson_progress.js?v=20260516j"></script>
  <script src="js/daily_storage.js?v=20260516p"></script>
  <script src="js/kana_keypad.js?v=20260516j"></script>
  <script src="js/views/units.js?v=20260516j"></script>
  <script src="js/views/quiz.js?v=20260516p"></script>
  <script src="js/views/particles.js?v=20260522g"></script>
  <script src="js/views/conjugation.js?v=20260516n"></script>
  <script src="js/views/flashcards.js?v=20260523f"></script>
  <script src="js/views/dictation.js?v=20260523c"></script>
  <script src="js/views/arrange.js?v=20260523b"></script>
  <script src="js/views/bookmarks.js?v=20260516j"></script>
  <script src="js/app.js?v=20260530b"></script>
  <script type="module" src="js/cloud_sync.js?v=20260516j"></script>
</body>
</html>
